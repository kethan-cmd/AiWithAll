services:
  web:
    image: node:22
    working_dir: /app
    # npm install first (predev copies OCR assets from node_modules), then dev
    # server binds 0.0.0.0; __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS (set by the
    # platform) lets the preview origin through Vite's host check.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./app:/app
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
